name: OpenBucket
options:
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGNING_ALLOWED: NO
packages:
  OpenBucketPackage:
    path: Packages/OpenBucket
targets:
  OpenBucket:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: OpenBucketPackage
        product: OpenBucketCore
      - package: OpenBucketPackage
        product: OpenBucketS3
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openbucket.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenBucket
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
  OpenBucketTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AppTests]
    dependencies:
      - target: OpenBucket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openbucket.app-tests
