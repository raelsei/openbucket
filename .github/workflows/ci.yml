name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Swift format
        run: swift format lint --strict --recursive App AppTests Packages/OpenBucket/Sources Packages/OpenBucket/Tests
      - name: Build and test
        run: >-
          xcodebuild test
          -project OpenBucket.xcodeproj
          -scheme OpenBucket
          -destination 'platform=macOS'
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
          -quiet
